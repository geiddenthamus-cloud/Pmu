<body>

<div class="header">
<h1>🏇 PMU Analyzer</h1>

<script>
const STATE={courses:[],currentCourse:null,currentAnalysis:null,seuil:0.80};

const PMU_BASE='https://online.turfinfo.api.pmu.fr/rest/client/61/programme';

const PROXIES=[
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)
];

async function smartFetch(url){
  const errors=[];
  for(let i=0;i<PROXIES.length;i++){
    try{
      const ctrl=new AbortController();
      const to=setTimeout(()=>ctrl.abort(),25000);
      const res=await fetch(PROXIES[i](url),{signal:ctrl.signal});
      clearTimeout(to);
      if(!res.ok){errors.push('HTTP '+res.status);continue}
      const text=await res.text();
      if(!text||text.length<20){errors.push('empty');continue}
      try{return JSON.parse(text)}catch(e){errors.push('bad json');continue}
    }catch(e){errors.push(e.message||'fail');continue}
  }
  throw new Error('Erreurs: '+errors.join(' | '));
}

function todayFR(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  return dd+mm+d.getFullYear();
}

async function fetchProgramme(){
  updateStatus('Récupération du programme...',true);
  const url=PMU_BASE+'/'+todayFR();
  const data=await smartFetch(url);
  return parseProgramme(data);
}

function parseProgramme(data){
  const courses=[];
  const reunions=(data.programme&&data.programme.reunions)||[];
  reunions.forEach(r=>{
    const hippo=r.hippodrome?(r.hippodrome.libelleLong||r.hippodrome.libelleCourt):'Réunion '+r.numOfficiel;
    (r.courses||[]).forEach(c=>{
      courses.push({
        id:r.numOfficiel+'_'+c.numOrdre,
        reunion:r.numOfficiel,
        hippodrome:hippo,
        numero:c.numOrdre,
        nom:c.libelle||c.libelleCourt||'Course',
        heure:c.heureDepart?new Date(c.heureDepart).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'',
        distance:c.distance||null,
        discipline:c.discipline||null,
        terrain:c.penetrometre?c.penetrometre.libelle:null,
        piste:c.categoriePiste||null,
        partants:[]
      });
    });
  });
  return courses;
}

async function fetchParticipants(course){
  const date=todayFR();
  const url=PMU_BASE+'/'+date+'/R'+course.reunion+'/C'+course.numero+'/participants';
  try{
    const data=await smartFetch(url);
    const parts=[];
    const list=data.participants||[];
    list.forEach(p=>{
      parts.push({
        numero:p.numPmu||p.numero,
        nom:p.nom||'Cheval',
        cote:(p.dernierRapportDirect&&p.dernierRapportDirect.rapport)||(p.dernierRapportReference&&p.dernierRapportReference.rapport)||null,
        jockey:p.driver||p.jockey||null,
        entraineur:p.entraineur||null,
        poids:p.poidsConditionMonte||p.poids||null,
        corde:p.placeCorde||null,
        age:p.age||null,
        sexe:p.sexe||null,
        performances:[]
      });
    });
    return parts.filter(p=>p.numero);
  }catch(e){
    console.warn('Participants error',e);
    return [];
  }
}

function perfToScore(place,nb){if(!place||!nb||nb<=1)return null;return Math.max(0,1-(place-1)/(nb-1))}
function recW(i,h=4){return Math.pow(.5,i/h)}
function scoreForme(perfs){const r=perfs.slice(0,6);let n=0,d=0;r.forEach((p,i)=>{const s=perfToScore(p.place,p.nb_partants);if(s===null)return;const w=recW(i);n+=w*s;d+=w});return{code:'forme',label:'Forme récente',weight:.15,value:d>0?n/d:0}}
function scoreHistorique(perfs){let n=0,d=0;perfs.forEach(p=>{const s=perfToScore(p.place,p.nb_partants);if(s===null)return;n+=s;d++});return{code:'historique',label:'Historique',weight:.10,value:d>0?n/d:0}}
function scoreDistance(perfs,dist){if(!dist)return{code:'distance',label:'Distance',weight:.12,value:0};let n=0,d=0;perfs.forEach(p=>{const s=perfToScore(p.place,p.nb_partants);if(s===null||!p.distance)return;const sim=Math.exp(-Math.abs(p.distance-dist)/600);n+=sim*s;d+=sim});return{code:'distance',label:'Distance',weight:.12,value:d>0?n/d:0}}
function scoreTerrain(perfs,t){if(!t)return{code:'terrain',label:'Terrain',weight:.08,value:0};let n=0,d=0;perfs.forEach(p=>{if(p.terrain!==t)return;const s=perfToScore(p.place,p.nb_partants);if(s===null)return;n+=s;d++});return{code:'terrain',label:'Terrain',weight:.08,value:d>0?n/d:0}}
function scorePiste(perfs,p){if(!p)return{code:'piste',label:'Piste',weight:.05,value:0};let n=0,d=0;perfs.forEach(x=>{if(x.piste!==p)return;const s=perfToScore(x.place,x.nb_partants);if(s===null)return;n+=s;d++});return{code:'piste',label:'Piste',weight:.05,value:d>0?n/d:0}}
function scorePoids(poids,moy){if(poids===null||moy===null)return{code:'poids',label:'Poids',weight:.04,value:.5};const d=poids-moy;return{code:'poids',label:'Poids',weight:.04,value:Math.max(0,Math.min(1,.5-d/10))}}
function scoreCorde(c,dist){if(c===null)return{code:'corde',label:'Corde',weight:.03,value:.5};const d=dist||2000;let v;if(d<1600)v=1-Math.min(Math.abs(c-5)/8,1);else v=.6;return{code:'corde',label:'Corde',weight:.03,value:v}}
function scoreJockey(perfs,j){if(!j)return{code:'jockey',label:'Jockey',weight:.06,value:.5};let n=0,d=0;perfs.forEach(p=>{if(p.jockey!==j)return;const s=perfToScore(p.place,p.nb_partants);if(s===null)return;n+=s;d++});return{code:'jockey',label:'Jockey',weight:.06,value:d>0?n/d:.5}}
function scoreEntraineur(perfs,e){if(!e)return{code:'entraineur',label:'Entraîneur',weight:.05,value:.5};let n=0,d=0;perfs.forEach(p=>{if(p.entraineur!==e)return;const s=perfToScore(p.place,p.nb_partants);if(s===null)return;n+=s;d++});return{code:'entraineur',label:'Entraîneur',weight:.05,value:d>0?n/d:.5}}
function scoreClasse(perfs){const a=perfs.map(p=>p.allocation).filter(x=>x);if(!a.length)return{code:'classe',label:'Classe',weight:.05,value:.5};const avg=a.reduce((x,y)=>x+y,0)/a.length;return{code:'classe',label:'Classe',weight:.05,value:Math.min(1,avg/100000)}}
function scoreRegularite(perfs){const p=perfs.map(x=>x.place).filter(x=>x!=null);if(p.length<2)return{code:'regularite',label:'Régularité',weight:.04,value:.3};const m=p.reduce((a,b)=>a+b,0)/p.length;const v=p.reduce((a,b)=>a+Math.pow(b-m,2),0)/p.length;const s=Math.sqrt(v);return{code:'regularite',label:'Régularité',weight:.04,value:Math.max(0,1-s/6)}}
function scoreContexte(perfs,race,j){let n=0,d=0;perfs.forEach(p=>{const s=perfToScore(p.place,p.nb_partants);if(s===null)return;const sim=ctxSim(race,p,j);n+=sim*s;d+=sim});return{code:'contexte',label:'Contexte',weight:.10,value:d>0?n/d:0}}
function ctxSim(r,p,j){const di=r.distance&&p.distance?Math.exp(-Math.abs(r.distance-p.distance)/600):.5;const t=r.terrain&&p.terrain?(r.terrain===p.terrain?1:.4):.5;const pi=r.piste&&p.piste?(r.piste===p.piste?1:.5):.5;const po=r.poidsMoyen&&p.poids?Math.exp(-Math.abs(r.poidsMoyen-p.poids)/6):.5;const jk=j&&p.jockey?(j===p.jockey?1:.3):.5;return .35*di+.25*t+.15*pi+.10*po+.15*jk}
function scoreMarche(c){if(!c||c<=1)return{code:'marche',label:'Marché',weight:.08,value:0};return{code:'marche',label:'Marché',weight:.08,value:Math.min(1,(1/c)*3)}}
function scoreOutsider(perfs,race,cote,j){const sig=[];let n=0;const ctx=scoreContexte(perfs,race,j);if(ctx.value>.6){sig.push('Contexte très favorable');n+=.3}const rec=perfs.slice(0,4);if(rec.length>=3){const r=rec.slice(0,2).filter(p=>p.place).map(p=>p.place);const a=rec.slice(2,4).filter(p=>p.place).map(p=>p.place);if(r.length&&a.length){const mr=r.reduce((x,y)=>x+y,0)/r.length;const ma=a.reduce((x,y)=>x+y,0)/a.length;if(mr<ma-1){sig.push('Forme en amélioration');n+=.25}}}if(cote&&cote>=10){sig.push('Cote élevée ('+cote.toFixed(1)+')');n+=.2}if(race.terrain&&perfs.some(p=>p.terrain===race.terrain&&p.place===1)){sig.push('Déjà gagné sur ce terrain');n+=.25}return{code:'outsider',label:'Signal outsider',weight:.06,value:Math.min(1,n),signals:sig}}
function scoreQualite(race,p,perfs){const c=[race.distance!=null,race.terrain!=null,p.poids!=null,p.corde!=null,p.jockey!=null,p.entraineur!=null,p.cote!=null,perfs.length>=3];return c.filter(Boolean).length/c.length}

function analyzeHorse(p,race){
  const perfs=(p.performances||[]);
  const factors=[scoreForme(perfs),scoreHistorique(perfs),scoreDistance(perfs,race.distance),scoreTerrain(perfs,race.terrain),scorePiste(perfs,race.piste),scorePoids(p.poids,race.poidsMoyen),scoreCorde(p.corde,race.distance),scoreJockey(perfs,p.jockey),scoreEntraineur(perfs,p.entraineur),scoreClasse(perfs),scoreRegularite(perfs),scoreContexte(perfs,race,p.jockey),scoreMarche(p.cote),scoreOutsider(perfs,race,p.cote,p.jockey)];
  const q=scoreQualite(race,p,perfs);
  const tw=factors.reduce((a,f)=>a+f.weight,0)||1;
  const w=factors.reduce((a,f)=>a+f.weight*f.value,0)/tw;
  const gs=w*(.6+.4*q);
  const o=factors.find(f=>f.code==='outsider');
  return{numero:p.numero,nom:p.nom,globalScore:Math.max(0,Math.min(1,gs)),qualite:q,factors,signauxOutsider:o&&o.signals?o.signals:[],estOutsider:o&&o.value>=.5,cote:p.cote};
}

function analyzeRace(course){
  const pl=course.partants.map(p=>p.poids).filter(p=>p!=null);
  const pm=pl.length?pl.reduce((a,b)=>a+b,0)/pl.length:null;
  const race={distance:course.distance,terrain:course.terrain,piste:course.piste,poidsMoyen:pm};
  const analyses=course.partants.map(p=>analyzeHorse(p,race));
  analyses.sort((a,b)=>b.globalScore-a.globalScore);
  analyses.forEach((a,i)=>a.rang=i+1);
  return{race,analyses};
}

function simulate(analyses,iter=5000){
  const n=analyses.length;if(!n)return{};
  const pos={};analyses.forEach(a=>pos[a.numero]={top1:0,top3:0,top5:0});
  for(let i=0;i<iter;i++){
    const draws=analyses.map(a=>{const sig=.06+.18*(1-(a.factors.find(f=>f.code==='regularite')?.value||.5));const u1=Math.random(),u2=Math.random();const z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);return{num:a.numero,score:a.globalScore+sig*z}});
    draws.sort((a,b)=>b.score-a.score);
    draws.forEach((d,idx)=>{if(idx===0)pos[d.num].top1++;if(idx<3)pos[d.num].top3++;if(idx<5)pos[d.num].top5++});
  }
  Object.keys(pos).forEach(k=>{pos[k].top1/=iter;pos[k].top3/=iter;pos[k].top5/=iter});
  return pos;
}

function generateCombos(analyses,mc,size,max){
  const ranked=analyses.slice().sort((a,b)=>b.globalScore-a.globalScore);
  const pool=new Set();ranked.slice(0,Math.min(12,ranked.length)).forEach(a=>pool.add(a.numero));
  analyses.filter(a=>a.estOutsider).forEach(a=>pool.add(a.numero));
  const arr=Array.from(pool);if(arr.length<size)return[];
  const combos=[];let ex=0;
  function rec(start,cur){if(ex>50000)return;if(cur.length===size){ex++;combos.push(cur.slice());return}for(let i=start;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop()}}
  rec(0,[]);
  const ev=combos.map(nums=>{let pr=1;nums.forEach(n=>{const p=mc[n];if(!p)return;pr*=(size<=1?p.top1:size<=3?p.top3:p.top5)});const conf=Math.pow(pr,1/size);const op=nums.some(n=>analyses.find(a=>a.numero===n)?.estOutsider);const sc=nums.map(n=>analyses.find(a=>a.numero===n)?.globalScore||0);const m=sc.reduce((a,b)=>a+b,0)/sc.length;const v=sc.reduce((a,b)=>a+Math.pow(b-m,2),0)/sc.length;return{nums,conf,robust:Math.max(0,1-v*4),op,risque:1-conf}});
  ev.sort((a,b)=>b.conf-a.conf);
  return ev.slice(0,max);
}

function buildComboOutput(c,analyses,scenario){
  const noms=c.nums.map(n=>analyses.find(a=>a.numero===n)?.nom||'?');
  const ex=[];c.nums.forEach(n=>{const a=analyses.find(x=>x.numero===n);if(!a)return;const top=a.factors.slice().sort((x,y)=>(y.weight*y.value)-(x.weight*x.value)).slice(0,2);top.forEach(f=>{if(f.weight*f.value>.05)ex.push(String(n).padStart(2,'0')+' '+a.nom+' : '+f.label+' ('+f.value.toFixed(2)+')')})});
  if(c.op)ex.push("Outsider inclus (diversification)");
  return{scenario,numeros:c.nums,noms,confiance:c.conf,robustesse:c.robust,risque:c.risque,outsiderPresent:c.op,explications:ex.slice(0,6)};
}

function showScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+n).classList.add('active');
  document.querySelector('.nav-btn[data-screen="'+n+'"]').classList.add('active');
  if(n==='accueil')renderAccueil();
  if(n==='course')renderCourse();
  if(n==='resultat')renderResultat();
}

function updateStatus(msg,load){document.getElementById('status').innerHTML=(load?'<span class="loader"></span> ':'')+msg}

function renderAccueil(){
  const el=document.getElementById('accueil-content');
  if(!STATE.courses.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📡</div><p>Aucune course chargée</p><button class="btn" onclick="loadAll()">Recharger</button></div>';
    return;
  }
  const byReu={};STATE.courses.forEach(c=>{(byReu[c.reunion]=byReu[c.reunion]||[]).push(c)});
  let html='<div class="info">'+STATE.courses.length+' courses · '+new Date().toLocaleTimeString('fr-FR')+'</div>';
  Object.keys(byReu).sort((a,b)=>a-b).forEach(r=>{
    const reu=byReu[r];
    html+='<div class="reunion-header">RÉUNION '+r+' · '+(reu[0].hippodrome||'')+'</div>';
    reu.forEach(c=>{
      html+='<div class="race-item" onclick="selectCourse(\''+c.id+'\')"><div class="rn">C'+c.numero+' — '+c.nom+'</div><div class="rm">'+c.heure+' · '+(c.distance?c.distance+'m':'')+' '+(c.discipline||'')+'</div></div>';
    });
  });
  el.innerHTML=html;
}

async function selectCourse(id){
  const c=STATE.courses.find(x=>x.id===id);
  if(!c)return;
  showScreen('course');
  document.getElementById('course-content').innerHTML='<div class="empty"><div class="loader"></div><p style="margin-top:12px">Chargement des partants...</p></div>';
  if(!c.partants.length){
    c.partants=await fetchParticipants(c);
  }
  if(!c.partants.length){
    document.getElementById('course-content').innerHTML='<div class="card"><div class="error">Aucun partant disponible.<br>Essaie une autre course ou attends un peu (les partants arrivent souvent 1h avant).</div><button class="btn" onclick="showScreen(\'accueil\')">Retour</button></div>';
    return;
  }
  STATE.currentCourse=c;
  STATE.currentAnalysis=analyzeRace(c);
  const mc=simulate(STATE.currentAnalysis.analyses,5000);
  const size=Math.min(5,STATE.currentAnalysis.analyses.length);
  STATE.currentAnalysis.mc=mc;
  const cp=generateCombos(STATE.currentAnalysis.analyses,mc,size,1);
  const ca=generateCombos(STATE.currentAnalysis.analyses,mc,size,1);
  const cs=generateCombos(STATE.currentAnalysis.analyses,mc,size,1);
  STATE.currentAnalysis.combinaisons=[];
  if(cp[0])STATE.currentAnalysis.combinaisons.push(buildComboOutput(cp[0],STATE.currentAnalysis.analyses,'principal'));
  if(ca[0])STATE.currentAnalysis.combinaisons.push(buildComboOutput(ca[0],STATE.currentAnalysis.analyses,'alternatif'));
  if(cs[0])STATE.currentAnalysis.combinaisons.push(buildComboOutput(cs[0],STATE.currentAnalysis.analyses,'surprise'));
  renderCourse();
}

function renderCourse(){
  const el=document.getElementById('course-content');
  if(!STATE.currentAnalysis){el.innerHTML='<div class="empty"><p>Sélectionne une course</p></div>';return}
  const c=STATE.currentCourse;
  let html='<div class="card"><h2>R'+c.reunion+'C'+c.numero+' · '+c.hippodrome+'</h2><div style="font-size:12px;color:#b0b8d0">'+c.nom+'</div><div style="font-size:11px;color:#6b7899;margin-top:6px">'+c.heure+' · '+(c.distance?c.distance+'m':'')+' · '+(c.discipline||'')+'</div></div>';
  html+='<div class="card"><h2>📊 Analyse ('+STATE.currentAnalysis.analyses.length+')</h2>';
  STATE.currentAnalysis.analyses.forEach(a=>{
    const p=(a.globalScore*100).toFixed(0);
    const col=a.globalScore>.6?'score-high':a.globalScore>.4?'score-mid':'score-low';
    html+='<div class="horse-row" onclick="showHorse('+a.numero+')"><div class="horse-num">'+a.numero+'</div><div class="horse-info"><div class="horse-name">'+a.nom+' '+(a.estOutsider?'<span class="badge badge-outsider">Outsider</span>':'')+' '+(a.rang===1?'<span class="badge badge-favori">Top</span>':'')+'</div><div class="horse-meta">'+(a.cote?'Cote '+a.cote.toFixed(2):'Cote —')+'</div><div class="score-bar"><div class="score-fill '+col+'" style="width:'+p+'%"></div></div></div><div class="horse-score">'+p+'%</div></div>';
  });
  html+='</div>';
  el.innerHTML=html;
}

function showHorse(num){
  const a=STATE.currentAnalysis.analyses.find(x=>x.numero===num);
  if(!a)return;
  let html='<div class="card"><h2>'+a.numero+'. '+a.nom+'</h2><div style="font-size:12px;color:#b0b8d0">Score : '+(a.globalScore*100).toFixed(1)+'%</div>';
  if(a.estOutsider)html+='<div class="warning" style="margin-top:10px">⚠️ '+a.signauxOutsider.join(' · ')+'</div>';
  html+='</div><div class="card"><h3>Facteurs</h3>';
  a.factors.slice().sort((x,y)=>(y.weight*y.value)-(x.weight*x.value)).forEach(f=>{
    html+='<div class="factor"><span class="factor-name">'+f.label+'</span><span class="factor-val">'+f.value.toFixed(2)+'</span></div>';
  });
  html+='</div><button class="btn btn-outline" onclick="renderCourse()">← Retour</button>';
  document.getElementById('course-content').innerHTML=html;
}

function renderResultat(){
  const el=document.getElementById('resultat-content');
  if(!STATE.currentAnalysis){el.innerHTML='<div class="empty"><div class="empty-icon">🎯</div><p>Sélectionne une course</p></div>';return}
  const combos=STATE.currentAnalysis.combinaisons;const s=STATE.seuil;
  const f=combos.filter(c=>c.confiance>=s);
  if(!f.length){el.innerHTML='<div class="card"><div class="warning">Aucune combinaison ne dépasse le seuil '+(s*100).toFixed(0)+'%</div></div>';return}
  let html='<div class="info">Seuil '+(s*100).toFixed(0)+'% · '+f.length+' combinaison(s)</div>';
  f.forEach(c=>{
    html+='<div class="combo"><div class="combo-header"><span class="combo-scenario scenario-'+c.scenario+'">'+c.scenario+'</span><span class="combo-conf">'+(c.confiance*100).toFixed(0)+'%</span></div><div class="combo-nums">'+c.numeros.map((n,i)=>'<span class="combo-num">'+String(n).padStart(2,'0')+' '+c.noms[i]+'</span>').join('')+'</div><div class="combo-detail">Robustesse '+(c.robustesse*100).toFixed(0)+'% · Risque '+(c.risque*100).toFixed(0)+'%'+(c.outsiderPresent?' · ⚠️ Outsider':'')+'</div>'+(c.explications.length?'<details><summary>Pourquoi ?</summary><div class="combo-expl">'+c.explications.map(e=>'• '+e).join('<br>')+'</div></details>':'')+'</div>';
  });
  el.innerHTML=html;
}

async function loadAll(){
  try{
    const courses=await fetchProgramme();
    if(!courses.length)throw new Error('Aucune course');
    STATE.courses=courses;
    updateStatus(courses.length+' courses · '+new Date().toLocaleTimeString('fr-FR'));
    renderAccueil();
  }catch(e){
    updateStatus('Erreur');
    document.getElementById('accueil-content').innerHTML='<div class="card"><div class="error">'+e.message+'</div><button class="btn" onclick="loadAll()">Réessayer</button></div>';
  }
}

loadAll();
</script>
